# Manual end-to-end run: Actions tab -> "demo" -> "Run workflow".
# With an ANTHROPIC_API_KEY repository secret it generates answers with Claude and
# scores them with the LLM judge; without one it runs retrieval-only.
name: demo

on:
  workflow_dispatch:
    inputs:
      questions:
        description: "How many test-set questions to use (18 = all)"
        default: "6"
      judge:
        description: "Score answers with the LLM judge"
        type: boolean
        default: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[claude,faiss,milvus,embeddings]"

      - name: Run benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set, running retrieval-only"
            rageval run -c configs/integration.yaml --offline --limit "${{ inputs.questions }}"
          elif [ "${{ inputs.judge }}" = "true" ]; then
            rageval run -c configs/sample.yaml --limit "${{ inputs.questions }}"
          else
            rageval run -c configs/sample.yaml --limit "${{ inputs.questions }}" --no-judge
          fi

      - name: Show the report on the run page
        run: |
          cat results/*/report.md >> "$GITHUB_STEP_SUMMARY"
          echo '### Token usage' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/*/usage.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: demo-results
          path: results/
